<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/costom.js"></script>
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .card { border-radius: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .form-label { font-weight: 500; }
    #responseMessage { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4">
          <h2 class="text-center mb-4">Tenant Details Form</h2>
          <form id="Tenant_details_form" onsubmit="return AddTenant_details();">
            <div class="mb-3">
              <label for="Tenant_name" class="form-label">Tenant Name</label>
              <input type="text" class="form-control" id="Tenant_name" name="Tenant_name" required>
            </div>
            <div class="mb-3">
              <label for="Room_number" class="form-label">Room Number</label>
              <input type="number" class="form-control" id="Room_number" name="Room_number" required>
            </div>
            <div class="mb-3">
              <label for="Mobile_number" class="form-label">Mobile Number</label>
              <input type="number" class="form-control" id="Mobile_number" name="Mobile_number" required>
            </div>
            <div class="mb-3">
              <label for="Permanent_address" class="form-label">Permanent Address</label>
              <input type="text" class="form-control" id="Permanent_address" name="Permanent_address">
            </div>
            <div class="mb-3">
              <label for="Local_address" class="form-label">Local Address</label>
              <input type="text" class="form-control" id="Local_address" name="Local_address">
            </div>
            <div class="mb-3">
              <label for="Aadhaar_number" class="form-label">Aadhaar Number</label>
              <input type="number" class="form-control" id="Aadhaar_number" name="Aadhaar_number">
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
            <div id="responseMessage" class="text-center"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
